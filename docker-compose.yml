services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: ingest_farm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest_farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - s3

  gst:
    build:
      context: .
      dockerfile: Dockerfile.gst
    profiles:
      - gst
    volumes:
      - ./data:/data
      - ./ingest_farm:/app/ingest_farm
      - ./scripts:/app/scripts
    working_dir: /app

volumes:
  postgres_data:
  minio_data:
