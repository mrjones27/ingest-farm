services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: ingest_farm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest_farm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - s3

  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    command: sh -c "npm ci && npm run build"

  api:
    build:
      context: .
      dockerfile: Dockerfile.gst
    command: ["python", "scripts/run_api.py"]
    env_file:
      - path: .env
        required: false
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://ingest:ingest@postgres:5432/ingest_farm
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/recordings
      API_HOST: 0.0.0.0
      API_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./ingest_farm:/app/ingest_farm
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./web/dist:/app/web/dist:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.gst
    command: ["python", "scripts/run_worker.py"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      WORKER_ID: worker-1
      WORKER_CAPACITY: "4"
    ports:
      - "5100:5100/udp"
      - "5001:5001/udp"
    volumes:
      - ./data:/data
      - ./ingest_farm:/app/ingest_farm
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  postprocess:
    build:
      context: .
      dockerfile: Dockerfile.gst
    command: ["python", "scripts/run_postprocess.py"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./data:/data
      - ./ingest_farm:/app/ingest_farm
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  gst:
    build:
      context: .
      dockerfile: Dockerfile.gst
    profiles:
      - gst
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./data:/data
      - ./ingest_farm:/app/ingest_farm
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    working_dir: /app

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
