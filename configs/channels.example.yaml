channels:
  - name: srt-channel-1
    source:
      protocol: srt
      uri: "srt://0.0.0.0:9000?mode=listener"
    pipeline:
      profile: ts_passthrough
      segment_duration_sec: 3600
    output:
      container: mpegts
      path_template: "recordings/{channel_id}/{session_id}/segment_%05d.ts"

  - name: udp-channel-1
    source:
      protocol: udp
      uri: "udp://0.0.0.0:5000"
      config:
        caps: "video/mpegts"
        transport: mpegts
    pipeline:
      profile: ts_passthrough
      segment_duration_sec: 1800
    output:
      container: mpegts

  - name: udp-rtp-h264
    source:
      protocol: udp
      uri: "udp://0.0.0.0:5004"
      config:
        transport: rtp-h264
    pipeline:
      profile: ts_passthrough
      segment_duration_sec: 1800
    output:
      container: mpegts

  - name: rtmp-pull-1
    source:
      protocol: rtmp
      uri: "rtmp://example.com/live/stream"
    pipeline:
      profile: ts_passthrough
      segment_duration_sec: 3600
    output:
      container: mpegts

  - name: hls-pull-1
    source:
      protocol: hls
      uri: "https://example.com/live/index.m3u8"
    pipeline:
      profile: ts_passthrough
      segment_duration_sec: 3600
    output:
      container: mpegts
